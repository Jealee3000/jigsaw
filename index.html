<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小狗家的拼图</title>
  <link rel="stylesheet" href="styles.css">
  <script src="game-logic.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <main class="game-shell" aria-label="小狗家的拼图游戏">
    <header class="top-bar" aria-label="游戏状态">
      <div class="title-block">
        <h1>小狗家的拼图</h1>
        <p>从本机图片库里挑一张，再选拼图大小</p>
      </div>

      <div class="controls" aria-label="拼图设置">
        <label class="file-control">
          <span>上传图片</span>
          <input id="image-input" type="file" accept="image/*">
        </label>

        <div class="grid-control" role="group" aria-label="拼图大小">
          <button class="grid-button active" type="button" data-grid-size="2" aria-pressed="true">2x2</button>
          <button class="grid-button" type="button" data-grid-size="3" aria-pressed="false">3x3</button>
          <button class="grid-button" type="button" data-grid-size="4" aria-pressed="false">4x4</button>
        </div>

        <div class="mode-control" role="group" aria-label="玩法模式">
          <button class="mode-button active" type="button" data-mode="guide" aria-pressed="true">底图</button>
          <button class="mode-button active" type="button" data-mode="correction" aria-pressed="true">纠错</button>
          <button class="mode-button" type="button" data-mode="hint" aria-pressed="false">提示</button>
        </div>
      </div>

      <div class="progress" aria-label="完成 0 / 4"></div>

      <button class="reset-button" id="reset-button" type="button" aria-label="重新开始">
        <span aria-hidden="true">↻</span>
      </button>

      <p class="status-message" id="status-message" role="status" aria-live="polite">正在读取图片列表</p>
    </header>

    <section class="game-layout">
      <section class="image-library" aria-label="图片列表">
        <div class="library-heading">
          <h2>图片列表</h2>
        </div>
        <div class="image-list" id="image-list" aria-live="polite"></div>
      </section>

      <section class="play-area" aria-label="拼图区">
        <div class="board-wrap">
          <div class="board" id="board" aria-label="拼图板">
            <div class="guide-image" id="guide-image" role="img" aria-label="当前拼图完整图片"></div>
            <div class="slot-layer" id="slot-layer" aria-label="拼图位置"></div>
          </div>
        </div>

        <div class="tray" id="tray" aria-label="拼图片托盘"></div>
      </section>
    </section>

    <section class="completion-overlay" id="celebration" aria-live="polite" hidden>
      <div class="completion-panel" role="dialog" aria-modal="true" aria-labelledby="completion-title">
        <div class="completion-stars" aria-hidden="true">★ ★ ★</div>
        <h2 id="completion-title">拼好了！</h2>
        <button class="replay-button" id="replay-button" type="button">再玩一次</button>
      </div>
    </section>
  </main>
</body>
</html>
